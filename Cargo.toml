[workspace]
resolver = "2"
members = [
    "examples/",
    "rend3",
    "rend3-anim",
    "rend3-egui",
    "rend3-framework",
    "rend3-gltf",
    "rend3-routine",
    "rend3-test",
    "rend3-types",
]

[workspace.package]
version = "0.30.0"

[workspace.dependencies]
wgpu = "30"
wgpu-types = "30"
# ***WRONG*** WGPU profiler has not caught up with WPGU yet.
wgpu-profiler = "^0.27"
glam = "^0.33"

[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = true
lto = "thin"
